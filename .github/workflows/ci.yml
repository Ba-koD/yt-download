name: ci

# 평소 검사. 도구를 담지 않고 빠르게 돌린다(포터블 빌드는 release 워크플로에서 한다).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 도구를 실행 파일에 담지 않는다. 여기서는 컴파일과 검사만 하면 된다.
  YT_DOWNLOAD_EMBED_TOOLS: "0"

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Version files agree
        run: ./scripts/check-version.sh

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: Frontend timeline checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --allow-read web/timeline-check.js

      - name: Extension tests
        run: deno test --allow-read extension/test/

      # 배포 페이지와 북마클릿 번들은 저장소에 담겨 있고, 페이지·CDN 이 그대로 실어 나른다.
      # 소스만 고치고 다시 만들지 않으면 사용자는 옛 판을 받는다.
      - name: Site and bookmarklet bundle are up to date
        run: |
          python3 scripts/build-bookmarklet.py
          git diff --exit-code docs/ \
            || (echo "docs/ 가 소스와 다릅니다. python scripts/build-bookmarklet.py 를 돌리고 커밋하세요." && exit 1)

      # 북마클릿은 jsDelivr 에서 받아온다. 그런데 @main 은 최대 12시간 캐시되므로,
      # 비워주지 않으면 고친 뒤에도 한참 동안 옛 판이 나간다(실제로 그랬다).
      # 캐시를 못 비워도 검사 자체는 통과시킨다 — 조금 늦게 퍼질 뿐이다.
      - name: Purge bookmarklet from CDN
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          for path in docs/bookmarklet/panel.js docs/bookmarklet.html docs/index.html; do
            curl -sS --max-time 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$path" || true
            echo
          done
