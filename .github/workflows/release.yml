name: release

# v0.1.0 같은 태그를 밀면 네 플랫폼용 포터블 실행 파일을 만들어 릴리스로 올린다.
# Actions 탭에서 태그를 골라 손으로 돌릴 수도 있다.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "빌드할 태그 (예: v0.1.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # 태그와 VERSION, Cargo.toml, CHANGELOG 가 서로 맞는지부터 본다.
  # 여기서 걸리면 30분짜리 빌드를 시작하지 않는다.
  verify:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Version files agree with the tag
        run: |
          chmod +x scripts/*.sh
          ./scripts/check-version.sh "${{ steps.resolve.outputs.tag }}"

  build:
    needs: verify
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            artifact: yt-download-windows-x64
          - os: ubuntu-22.04
            label: Linux (x64)
            artifact: yt-download-linux-x64
          - os: macos-15
            label: macOS (Apple Silicon)
            artifact: yt-download-macos-arm64
          # Intel 러너는 macos-13 이 사라지고 macos-15-intel 로 바뀌었다.
          # 없어진 라벨을 쓰면 잡히지 않고 큐에서 계속 기다린다.
          - os: macos-15-intel
            label: macOS (Intel)
            artifact: yt-download-macos-x64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 리눅스 webview 는 시스템 라이브러리가 필요하다.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # ffmpeg/ffprobe 는 bundle-tools 스크립트가 정적 빌드를 직접 받아온다.
      # (패키지 매니저로 깔면 공유 라이브러리에 묶여서 다른 PC 로 못 옮긴다.)
      - name: Bundle tools and build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-portable.ps1

      - name: Bundle tools and build (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-portable.sh

      - name: Test
        run: cargo test --release

      # 업로드되는 아티팩트는 실행 권한을 잃는다. 유닉스는 tar 로 묶어 권한을 지킨다.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ matrix.artifact }}"
          Compress-Archive -Path dist\yt-download.exe, dist\yt-download-extension-manager.exe -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "$name.zip.sha256" -Encoding ascii

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          name="${{ matrix.artifact }}"
          # macOS 는 앱 번들만 담는다(번들 안에 같은 실행 파일이 들어 있다).
          if [ -d dist/yt-download.app ]; then
            tar -czf "$name.tar.gz" -C dist yt-download.app yt-download-extension-manager
          else
            tar -czf "$name.tar.gz" -C dist yt-download yt-download-extension-manager
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # 크롬 확장은 플랫폼을 타지 않으므로 여기서 한 번만 묶는다.
      # 담을 것을 하나씩 적는다(테스트 픽스처가 딸려 들어가지 않도록).
      - name: Package extension
        run: |
          (cd extension && zip -qr ../yt-download-extension.zip manifest.json src vendor README.md)
          sha256sum yt-download-extension.zip > yt-download-extension.zip.sha256
          unzip -l yt-download-extension.zip
          # 압축을 푼 자리에 manifest.json 이 바로 있어야 크롬이 폴더로 인식한다.
          unzip -l yt-download-extension.zip | grep -q ' manifest.json$'

      # 담을 것을 손으로 적다 보니 새 폴더를 빠뜨리기 쉽다(vendor 를 실제로 빠뜨렸다).
      # 확장이 실제로 읽는 파일이 전부 들어갔는지 확인한다.
      - name: Extension archive is complete
        run: python3 scripts/check-extension-zip.py yt-download-extension.zip extension

      # 아티팩트는 이름별 폴더로 내려온다. 한곳에 모으고 체크섬은 한 파일로 합친다.
      - name: Collect assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec mv {} release/ \;
          mv yt-download-extension.zip release/
          {
            find artifacts -type f -name '*.sha256' -exec cat {} +
            cat yt-download-extension.zip.sha256
          } | sort -k2 > release/SHA256SUMS.txt
          ls -l release
          cat release/SHA256SUMS.txt

      - name: Build release notes
        run: |
          chmod +x scripts/*.sh
          ./scripts/release-notes.sh "${{ needs.verify.outputs.version }}" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: yt-download ${{ needs.verify.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: release/*
          fail_on_unmatched_files: true
