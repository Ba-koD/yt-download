name: release

# v0.1.0 같은 태그를 밀면 네 플랫폼용 포터블 실행 파일을 만들어 릴리스로 올린다.
# Actions 탭에서 태그를 골라 손으로 돌릴 수도 있다.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "빌드할 태그 (예: v0.1.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # 태그와 VERSION, Cargo.toml, CHANGELOG 가 서로 맞는지부터 본다.
  # 여기서 걸리면 30분짜리 빌드를 시작하지 않는다.
  verify:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Version files agree with the tag
        run: |
          chmod +x scripts/*.sh
          ./scripts/check-version.sh "${{ steps.resolve.outputs.tag }}"

  build:
    needs: verify
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (x64)
            artifact: yt-download-windows-x64
          - os: ubuntu-22.04
            label: Linux (x64)
            artifact: yt-download-linux-x64
          - os: macos-15
            label: macOS (Apple Silicon)
            artifact: yt-download-macos-arm64
          # Intel 러너는 macos-13 이 사라지고 macos-15-intel 로 바뀌었다.
          # 없어진 라벨을 쓰면 잡히지 않고 큐에서 계속 기다린다.
          - os: macos-15-intel
            label: macOS (Intel)
            artifact: yt-download-macos-x64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 리눅스 webview 는 시스템 라이브러리가 필요하다.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      # ffmpeg/ffprobe 는 bundle-tools 스크립트가 정적 빌드를 직접 받아온다.
      # (패키지 매니저로 깔면 공유 라이브러리에 묶여서 다른 PC 로 못 옮긴다.)
      - name: Bundle tools and build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-portable.ps1

      - name: Bundle tools and build (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-portable.sh

      - name: Test
        run: cargo test --release

      # 앱과 관리자를 따로 묶는다. 둘이 한 압축본에 들어 있던 시절에는
      # 4MB 짜리 관리자만 고쳐도 167MB 를 다시 받아야 했다(자동 업데이트가 이걸 매번 한다).
      # 버전은 여전히 함께 간다 — VERSION 하나가 앱·관리자·확장을 다 정한다.
      #
      # 업로드되는 아티팩트는 실행 권한을 잃는다. 유닉스는 tar 로 묶어 권한을 지킨다.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = "${{ matrix.artifact }}"
          # 관리자는 실행 파일 하나뿐이라 압축하지 않고 그대로 올린다. 받아서 바로 실행할 수 있다.
          # (앱은 165MB 대 170MB 차이가 나서 압축본으로 둔다.)
          $manager = ($app -replace '^yt-download-', 'yt-download-manager-') + ".exe"
          Compress-Archive -Path dist\yt-download.exe -DestinationPath "$app.zip"
          Copy-Item dist\yt-download-extension-manager.exe $manager
          foreach ($name in @("$app.zip", $manager)) {
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Set-Content "$name.sha256" -Encoding ascii
          }

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          app="${{ matrix.artifact }}"
          manager="${app/#yt-download-/yt-download-manager-}"
          # macOS 는 앱 번들만 담는다(번들 안에 같은 실행 파일이 들어 있다).
          if [ -d dist/yt-download.app ]; then
            tar -czf "$app.tar.gz" -C dist yt-download.app
          else
            tar -czf "$app.tar.gz" -C dist yt-download
          fi
          # 관리자는 실행 파일 하나뿐이라 묶지 않는다. 받은 사람은 chmod +x 를 한 번 해주면 된다
          # (자동 업데이트는 스스로 권한을 주므로 영향받지 않는다).
          cp dist/yt-download-extension-manager "$manager"
          for name in "$app.tar.gz" "$manager"; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$name" > "$name.sha256"
            else
              shasum -a 256 "$name" > "$name.sha256"
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.*
            yt-download-manager-*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # 크롬 확장은 플랫폼을 타지 않으므로 여기서 한 번만 묶는다.
      # 담을 것을 하나씩 적는다(테스트 픽스처가 딸려 들어가지 않도록).
      - name: Package extension
        run: |
          (cd extension && zip -qr ../yt-download-extension.zip manifest.json icons src vendor README.md)
          sha256sum yt-download-extension.zip > yt-download-extension.zip.sha256
          unzip -l yt-download-extension.zip
          # 압축을 푼 자리에 manifest.json 이 바로 있어야 크롬이 폴더로 인식한다.
          unzip -l yt-download-extension.zip | grep -q ' manifest.json$'

      # 담을 것을 손으로 적다 보니 새 폴더를 빠뜨리기 쉽다(vendor 를 실제로 빠뜨렸다).
      # 확장이 실제로 읽는 파일이 전부 들어갔는지 확인한다.
      - name: Extension archive is complete
        run: python3 scripts/check-extension-zip.py yt-download-extension.zip extension

      # 파이어폭스용은 매니페스트만 바꿔 담는다(배경 방식·확장 ID 가 다르다).
      # 크롬 소스에서 뽑으므로 두 브라우저가 갈라져 관리되지 않는다.
      - name: Package Firefox extension
        run: |
          python3 scripts/build-firefox.py
          mv dist/yt-download-extension-firefox.zip .
          sha256sum yt-download-extension-firefox.zip > yt-download-extension-firefox.zip.sha256

      # 서명된 CRX 와 update.xml. 관리자가 브라우저 정책에 걸어두면 브라우저가
      # 이 둘만 보고 스스로 설치하고 스스로 갱신한다(사람이 폴더를 얹을 필요가 없다).
      #
      # 키가 없으면 여기서 세운다. 조용히 건너뛰면 CRX 없는 릴리스가 나가고,
      # 정책으로 깔아 쓰는 사람들은 갱신이 멈춘 줄도 모른 채 옛 판에 남는다.
      - name: Signing key is present
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "CRX_PRIVATE_KEY 시크릿이 없습니다." >&2
            echo "저장소 Settings → Secrets and variables → Actions 에 개인키 PEM 을 넣어주세요." >&2
            exit 1
          fi

      - name: Sign the extension (CRX)
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check cryptography
          # 키는 러너 안에서만 쓰고 바로 지운다. 작업 폴더는 아티팩트로 올라가지 않지만
          # 로그·자산에 섞여 나갈 여지를 아예 남기지 않는다.
          umask 077
          printf '%s' "$CRX_PRIVATE_KEY" > crx-key.pem
          python3 scripts/pack-crx.py --key crx-key.pem
          rm -f crx-key.pem
          mv dist/yt-download.crx dist/update.xml .
          sha256sum yt-download.crx > yt-download.crx.sha256

      # 브라우저가 갱신 여부를 판단하는 근거다. 여기 적힌 버전이 태그와 다르면
      # 새 판이 올라가도 아무도 받아가지 않는다(아무 소리 없이).
      - name: Update manifest points at this version
        run: |
          cat update.xml
          grep -q "version='${{ needs.verify.outputs.version }}'" update.xml

      # CRX 는 헤더 + zip 이다. 담을 파일 목록을 손으로 적는 자리가 하나 더 늘었으니
      # 여기서도 확인한다(전에 vendor 를 통째로 빠뜨린 적이 있다).
      - name: CRX contents are complete
        run: |
          python3 - <<'PY'
          import struct, pathlib
          data = pathlib.Path("yt-download.crx").read_bytes()
          assert data[:4] == b"Cr24", "CRX 머리표가 아닙니다"
          _, header_len = struct.unpack("<II", data[4:12])
          pathlib.Path("crx-inner.zip").write_bytes(data[12 + header_len:])
          PY
          python3 scripts/check-extension-zip.py crx-inner.zip extension
          rm -f crx-inner.zip

      # 아티팩트는 이름별 폴더로 내려온다. 한곳에 모으고 체크섬은 한 파일로 합친다.
      - name: Collect assets
        run: |
          mkdir -p release
          # 확장자로 고르지 않는다. 관리자는 압축하지 않고 올라가고 유닉스에서는 확장자도 없어서,
          # 목록을 적어두면 조용히 빠진다. 체크섬 파일만 남기고 전부 옮긴다.
          find artifacts -type f ! -name '*.sha256' -exec mv {} release/ \;
          mv yt-download-extension.zip release/
          mv yt-download-extension-firefox.zip release/
          # update.xml 은 이름이 고정이어야 한다. 브라우저가 늘 같은 주소
          # (releases/latest/download/update.xml) 로 물어보기 때문이다.
          mv yt-download.crx update.xml release/
          {
            find artifacts -type f -name '*.sha256' -exec cat {} +
            cat yt-download-extension.zip.sha256
            cat yt-download-extension-firefox.zip.sha256
            cat yt-download.crx.sha256
          } | sort -k2 > release/SHA256SUMS.txt
          ls -l release
          cat release/SHA256SUMS.txt

      - name: Build release notes
        run: |
          chmod +x scripts/*.sh
          ./scripts/release-notes.sh "${{ needs.verify.outputs.version }}" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: yt-download ${{ needs.verify.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: release/*
          fail_on_unmatched_files: true
