[workspace]
# 확장 관리자는 앱과 따로 도는 작은 프로그램이라 별도 크레이트로 둔다.
# 자동 업데이트는 앱과 관리자가 똑같이 하는 일이라 공용 크레이트로 뺐다.
members = ["manager", "update"]

[package]
name = "yt-download"
version = "0.3.1"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1.0"
flate2 = "1.0"
axum = "0.7"
dirs = "5.0"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tao = "0.35"
tokio = { version = "1.42", features = ["full"] }
tokio-tungstenite = "0.29"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1.11", features = ["v4"] }
webbrowser = "1.0"
wry = "0.55"
yt-download-update = { path = "update" }

[build-dependencies]
flate2 = "1.0"

# 배포용 빌드는 크기와 속도를 함께 챙긴다.
[profile.release]
opt-level = 3
# 얇은 LTO 는 값이 싸다. 반면 codegen-units = 1 은 빌드를 크게 늦추면서
# 이 앱에는 거의 도움이 되지 않는다(무거운 일은 yt-dlp 와 ffmpeg 가 한다).
# 깨끗한 상태에서 재본 값 — 65초/6.0MB(=1) 대 49초/6.5MB(기본값).
lto = "thin"
strip = true
panic = "unwind"
