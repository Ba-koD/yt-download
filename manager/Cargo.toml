[package]
name = "yt-download-extension-manager"
version = "0.7.0"
edition = "2021"
build = "build.rs"

# 실행 파일에 아이콘을 박아 넣는다.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
anyhow = "1.0"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tao = "0.35"
wry = "0.55"
# 릴리스 조회·SHA256 대조·압축 풀기·실행 파일 바꿔 끼우기는 앱과 하는 일이 같다.
# 공용 크레이트로 빼서 둘이 함께 쓴다.
yt-download-update = { path = "../update" }
