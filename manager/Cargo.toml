[package]
name = "yt-download-extension-manager"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
dirs = "5.0"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tao = "0.35"
wry = "0.55"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
